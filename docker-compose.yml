# Local development infrastructure.
# Requires Docker — if Docker is unavailable on your machine, the project
# falls back to an embedded PostgreSQL runtime (see docs/ENVIRONMENT.md).
services:
  postgres:
    image: postgres:16-alpine
    container_name: gbl80s-postgres
    environment:
      POSTGRES_USER: gbl
      POSTGRES_PASSWORD: gbl_dev_password
      POSTGRES_DB: gbl80s
    ports:
      - "5432:5432"
    volumes:
      - gbl80s-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbl -d gbl80s"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gbl80s-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gbl_minio
      MINIO_ROOT_PASSWORD: gbl_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.minio-data:/data

volumes:
  gbl80s-pgdata:
